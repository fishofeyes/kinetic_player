name: kinetic_player
description: "Multi-core Flutter video player: GSYVideoPlayer (Android) + SGPlayer (iOS/macOS) + Artplayer.js (Web) + libmpv (Windows/Linux)."
version: 2.1.2
homepage: https://github.com/wanwenfeng4798/kinetic_player
license: MIT

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  material_ui: ^1.7.0
  video_player: ^2.14.1
  video_player_platform_interface: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    # SGPlayer: sharedDarwinSource + SPM remote binaryTarget; CocoaPods prepare_command → ensure.
    enable-swift-package-manager: true

  plugin:
    platforms:
      android:
        package: com.keepwan.kinetic_player
        pluginClass: KineticPlayerPlugin
      ios:
        pluginClass: KineticPlayerPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: KineticPlayerPlugin
        sharedDarwinSource: true
      web:
        pluginClass: KineticPlayerPlugin
        fileName: kinetic_player_web.dart
      windows:
        pluginClass: KineticPlayerPlugin
      linux:
        pluginClass: KineticPlayerPlugin

  assets:
    - assets/web/kinetic_artplayer.js

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
